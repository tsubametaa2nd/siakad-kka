services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kka-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=docker
    healthcheck:
      test: ["CMD-SHELL", "bun --eval 'fetch(\"http://localhost:3000/health\").then(r => process.exit(r.ok ? 0 : 1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
